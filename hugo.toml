baseURL = 'https://RainyCyan.github.io/'
languageCode = 'zh-cn'
title = "RainyCyan's Blog"
theme = "PaperMod"
defaultContentLanguage = 'zh'
enableInlineShortcodes = true
enableGitInfo = true

[pagination]
  pagerSize = 10

[frontmatter]
  lastmod = [":git", "lastmod", "date", "publishDate"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  # 首页模式 - 使用 homeInfoParams 显示个人简介
  profileMode = false
  homeInfoParams = false

  # 首页个人简介内容（通过 _index.md 的 Content 显示）
  homeInfoTitle = "RainyCyan's Blog"

  # 文章页
  ShowToc = false
  TocOpen = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowRssButtonInSectionTermList = true
  ShowPageNums = true

  # 日期格式
  DateFormat = "2006-01-02"

  # 主页显示的文章分类
  mainSections = ["blog", "posts"]

  # 禁用特殊第一篇
  disableSpecial1stPost = true

  # 隐藏作者
  hideAuthor = true

  # 使用Hugo内置目录
  UseHugoToc = true

  # 标签/分类页显示文章数
  ShowTagCountInTerms = true
  ShowCategoryCountInTerms = true

  # 首页最近更新数量
  recentPosts = 8

  # 数学公式支持
  math = true

  # 社交链接
  socialIcons = [
    {name = "github", url = "https://github.com/RainyCyan"},
  ]

# 导航菜单
[languages]
  [languages.zh]
    languageName = "中文"
    contentDir = "content"

    [[languages.zh.menu.main]]
      identifier = "posts"
      name = "所有文章"
      url = "/blog/"
      weight = 1
    [[languages.zh.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/tags/"
      weight = 2
    [[languages.zh.menu.main]]
      identifier = "categories"
      name = "分类"
      url = "/categories/"
      weight = 3
    [[languages.zh.menu.main]]
      identifier = "search"
      name = "搜索"
      url = "/search/"
      weight = 4
    [[languages.zh.menu.main]]
      identifier = "archives"
      name = "归档"
      url = "/archives/"
      weight = 5
